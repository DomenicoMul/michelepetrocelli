<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elenco Post</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    /* Griglia a colonne reattiva */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 30px auto;
    }

    /* Scheda del post */
    .post-card {
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .post-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
    }

    .post-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      cursor: pointer;
    }

    .post-card h2 {
      font-size: 1.1rem;
      margin: 15px;
      color: #222;
      text-align: center;
    }

    .post-card a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
<body>

  <h1>Tutti i Post</h1>
  <div class="posts-grid" id="postsContainer"></div>

  <script>
    // Elenco dei file markdown presenti in content/post/
    // (In un ambiente reale, questo array può essere generato automaticamente da uno script o letto da un posts.json)
    const postFiles = [
      '2026-09-25-prova-articolo-del-blog.md',
      '2026-09-25-test.md'
    ];

    const postsContainer = document.getElementById('postsContainer');

    // Funzione per estrarre Titolo e Immagine dal contenuto Markdown / Front Matter
    function parseMarkdown(mdText, filename) {
      // Estrae il titolo (es. # Titolo oppure title: "Titolo")
      const titleMatch = mdText.match(/^title:\s*["']?(.*?)["']?$/m) \vert{}\vert{} mdText.match(/^#\s+(.*)$/m);
      const title = titleMatch ? titleMatch[1] : filename.replace('.md', '');

      // Estrae l'immagine (es. image: "/path/img.jpg" oppure ![alt](url))
      const imageMatch = mdText.match(/^image:\s*["']?(.*?)["']?$/m) || mdText.match(/!\[.*?\]\((.*?)\)/);
      const image = imageMatch ? imageMatch[1] : 'https://via.placeholder.com/300x200?text=No+Image';

      // Genera il link alla pagina del post (sostituendo .md con .html o usando la rotte del tuo sito)
      const postUrl = `content/post/${filename.replace('.md', '.html')}`;

      return { title, image, postUrl };
    }

    async function loadPosts() {
      for (const file of postFiles) {
        try {
          const response = await fetch(`content/posts/${file}`);
          if (!response.ok) continue;

          const text = await response.text();
          const { title, image, postUrl } = parseMarkdown(text, file);

          // Creazione dell'elemento HTML per la colonna/card
          const card = document.createElement('div');
          card.className = 'post-card';
          card.innerHTML = `
            <a href="${postUrl}">
              <img src="${image}" alt="${title}" loading="lazy">
            </a>
            <h2>
              <a href="${postUrl}">${title}</a>
            </h2>
          `;

          postsContainer.appendChild(card);
        } catch (error) {
          console.error(`Errore nel caricamento del file ${file}:`, error);
        }
      }
    }

    loadPosts();
  </script>
</body>
</html>
